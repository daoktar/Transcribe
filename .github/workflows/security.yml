name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      # PYSEC-2026-3624 / CVE-2026-58659 — RCE in lightning's
      # LightningModule.load_from_checkpoint: a crafted checkpoint can smuggle module
      # names through the _instantiator hyperparameters and execute them, bypassing
      # weights_only=True. lightning is a transitive dependency (pyannote.audio requires
      # lightning>=2.4 for diarization); it is not in requirements.txt.
      #
      # Not upgradable: every published release is affected (1.8.0 through 2.6.5) and
      # 2.6.5 is the latest — the fix exists only as commit d710d68 (PR #21832), unreleased.
      # The "fix version 2022.6.15" pip-audit prints is an artefact of lightning's old
      # CalVer scheme, not an installable release.
      #
      # Not reachable here: the only checkpoint this app ever loads is the hardcoded
      # pyannote/speaker-diarization-3.1 pipeline from Hugging Face (transcribe/diarize.py).
      # No user input reaches load_from_checkpoint — no checkpoint paths, URLs or model
      # ids are accepted from the CLI, the web API or the desktop app.
      #
      # Drop this flag once lightning ships a release above 2.6.5 that carries the fix.
      - name: Run pip-audit
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-3624

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
